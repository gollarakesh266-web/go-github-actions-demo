name: cicd pipeline
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'

      - name: Run tests
        run: go test ./...

      - name: Build application
        run: go build ./...

